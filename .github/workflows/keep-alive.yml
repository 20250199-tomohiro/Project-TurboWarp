name: keep-alive

# サイトがスリープしないように、定期的にアクセスする
# 事前に、リポジトリの Settings > Secrets and variables > Actions > Variables に
# SITE_URL(例: https://example.onrender.com)を登録してください
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: サイトにアクセスする
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "リポジトリの変数 SITE_URL が設定されていません" >&2
            exit 1
          fi
          # スリープ中は起動に時間がかかるので、長めに待って数回やり直す
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors "${SITE_URL%/}/healthz"
