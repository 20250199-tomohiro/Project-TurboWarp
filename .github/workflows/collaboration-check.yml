name: Collaboration API syntax check

on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'collaboration.js'
      - 'account-menu.js'
      - 'package.json'
      - 'packager.html'
      - 'my.html'
      - 'scripts/check-html.js'
      - '.github/workflows/collaboration-check.yml'
  push:
    branches: [feature/friends-collaboration]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check collaboration.js
          node --check account-menu.js
          node scripts/check-html.js
