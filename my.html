<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>私の作品</title>
<style>
  :root {
    --accent: #FF4C4C; --bg: #f3f4f6; --fg: #111; --card: #fff; --muted: #666; --line: #d1d5db; --bad: #b00020; --ok: #15803d;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --fg: #f3f4f6; --card: #1f2937; --muted: #9ca3af; --line: #374151; --bad: #f87171; --ok: #4ade80; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  header { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 16px 8px; }
  .logo { display: block; width: min(320px, 70vw); height: auto; }
  nav { display: flex; gap: 16px; font-size: 14px; }
  nav a { color: var(--fg); }
  main { width: min(900px, 100%); margin: 0 auto; padding: 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .count { margin: 0 0 16px; color: var(--muted); }
  input, button, .btn { font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
                        background: var(--card); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-block; }
  button:disabled { opacity: .6; cursor: default; }
  .primary { border: 0; background: var(--accent); color: #fff; font-weight: 700; }
  .primary:hover { filter: brightness(0.92); }
  .danger { color: var(--bad); border-color: var(--bad); }
  #status { min-height: 1.5em; margin: 0 0 12px; font-size: 14px; color: var(--bad); }
  #status.ok { color: var(--ok); }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px;
          background: var(--card); border: 1px solid var(--line); min-height: 150px; }
  .card.empty { align-items: center; justify-content: center; color: var(--muted); border-style: dashed; background: transparent; }
  .title { font-weight: 700; font-size: 16px; word-break: break-word; }
  .meta { font-size: 12px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .actions button, .actions .btn { padding: 6px 10px; font-size: 13px; }
  .upload { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
  .upload p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .scratch-search{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .scratch-search input{flex:1 1 240px;min-width:0}
  .scratch-projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
  .scratch-project{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .scratch-project img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--bg)}
  .scratch-project strong{overflow-wrap:anywhere}
  #scratchStatus{min-height:1.4em;color:var(--muted)}

</style>
<link rel="stylesheet" href="/mirror-ui.css?v=3">
<script src="/mirror-theme.js?v=i18n1" defer></script></head>
<body>
<header class="mirror-topbar">
  <a class="mirror-brand" href="/" aria-label="TurboWarp ホーム">TURBOWARP</a>
  <nav class="mirror-main-nav" aria-label="メインナビゲーション">
    <a class="mirror-new-project" href="/editor.html"><span aria-hidden="true">＋</span> 新規作成</a>
    <a href="/">ホーム</a><a href="/my">私の作品</a><a href="/search">作品を探す</a>
    <a href="/friends">フレンド</a><a href="/messages">メッセージ</a>
    <a href="/collaboration">共同制作</a><a href="/packager">パッケージ化</a>
  </nav>
</header>
<main>
  <h1>私の作品</h1>
  <p class="count" id="count">読み込み中…</p>
  <p id="status" role="status"></p>
  <div id="list"></div>

  <section class="upload" id="scratchImport">
    <h2>Scratchの作品を追加</h2>
    <p>Scratchのユーザー名を入力すると、そのユーザーが公開している作品を一覧表示して、このアカウントの「私の作品」に取り込めます。</p>
    <p>Scratchのパスワードは入力しないでください。非公開作品は取り込めません。</p>
    <div class="scratch-search"><input id="scratchUsername" type="text" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Scratchユーザー名"><button type="button" class="primary" id="scratchSearchBtn">作品を検索</button></div>
    <p id="scratchStatus" role="status" aria-live="polite"></p>
    <div id="scratchProjects" class="scratch-projects"></div>
  </section>
  <div class="upload">
    <p>パソコンに保存した .sb3 ファイルを、「私の作品」に追加できます(1つの作品は <span id="maxMb">15</span>MB まで)。</p>
    <input type="file" id="file" accept=".sb3" hidden>
    <button type="button" class="primary" id="uploadBtn">ファイルから追加</button>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let state = { max: 5, maxBytes: 15 * 1024 * 1024, projects: [] };

  const setStatus = (text, ok = false) => {
    $('status').textContent = text || '';
    $('status').classList.toggle('ok', !!ok);
  };
  const fmtSize = (n) => (n >= 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
  const fmtDate = (s) => {
    const d = new Date(s);
    return Number.isNaN(d.getTime()) ? '' : d.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false });
  };

  const api = async (path, opts = {}) => {
    const headers = { 'X-Mirror': '1' };
    if (opts.json !== undefined) headers['Content-Type'] = 'application/json';
    if (opts.raw !== undefined) headers['Content-Type'] = 'application/octet-stream';
    const res = await fetch(path, {
      method: opts.method || 'GET',
      headers,
      credentials: 'same-origin',
      body: opts.json !== undefined ? JSON.stringify(opts.json) : opts.raw
    });
    if (res.status === 401) {
      location.reload();
      throw new Error('ログインが必要です');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || ('エラーが発生しました(' + res.status + ')'));
    return data;
  };

  const button = (label, onClick, className) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    if (className) b.className = className;
    b.addEventListener('click', async () => {
      b.disabled = true;
      try { await onClick(); } finally { b.disabled = false; }
    });
    return b;
  };

  const render = () => {
    const list = $('list');
    list.replaceChildren();
    $('count').textContent = state.projects.length + ' / ' + state.max + ' 個を保存中';
    $('maxMb').textContent = String(Math.round(state.maxBytes / 1024 / 1024));
    $('uploadBtn').disabled = state.projects.length >= state.max;

    for (const p of state.projects) {
      const card = document.createElement('div');
      card.className = 'card';

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = p.title;

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = '更新: ' + fmtDate(p.updated_at) + ' ・ ' + fmtSize(p.size);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const open = document.createElement('a');
      open.className = 'btn primary';
      open.href = '/my/open/' + encodeURIComponent(p.id);
      open.textContent = '開く';

      const download = document.createElement('a');
      download.className = 'btn';
      download.href = '/my/api/projects/' + encodeURIComponent(p.id) + '/file';
      download.textContent = 'ダウンロード';

      actions.append(
        open,
        button('名前を変える', async () => {
          const name = prompt('新しい名前を入力してください', p.title);
          if (name === null || !name.trim()) return;
          try {
            await api('/my/api/projects/' + p.id + '/rename', { method: 'POST', json: { title: name } });
            await load();
          } catch (err) { setStatus(err.message); }
        }),
        download,
        button('削除', async () => {
          if (!confirm('「' + p.title + '」を削除します。この操作は元に戻せません。')) return;
          try {
            await api('/my/api/projects/' + p.id, { method: 'DELETE' });
            setStatus('削除しました', true);
            await load(true);
          } catch (err) { setStatus(err.message); }
        }, 'danger')
      );

      card.append(title, meta, actions);
      list.append(card);
    }

    for (let i = state.projects.length; i < state.max; i++) {
      const empty = document.createElement('div');
      empty.className = 'card empty';
      empty.textContent = '空き';
      list.append(empty);
    }
  };

  const load = async (keepStatus) => {
    if (!keepStatus) setStatus('');
    try {
      state = await api('/my/api/projects');
      render();
    } catch (err) {
      $('count').textContent = '';
      setStatus(err.message);
    }
  };

  const scratchStatus = (message, bad = false) => {
    const el = $('scratchStatus'); el.textContent = message; el.style.color = bad ? 'var(--bad)' : 'var(--muted)';
  };
  const searchScratch = async () => {
    const username = $('scratchUsername').value.trim();
    if (!/^[A-Za-z0-9_-]{1,20}$/.test(username)) return scratchStatus('Scratchユーザー名を正しく入力してください。', true);
    $('scratchSearchBtn').disabled = true; $('scratchProjects').replaceChildren(); scratchStatus('Scratchの公開作品を検索しています…');
    try {
      const response = await fetch('/my/api/scratch/' + encodeURIComponent(username) + '/projects', { headers: { Accept: 'application/json' }, credentials: 'same-origin' });
      const data = await response.json(); if (!response.ok) throw new Error(data.message || '作品一覧を取得できませんでした');
      if (!data.projects.length) { scratchStatus('公開されている作品が見つかりませんでした。'); return; }
      scratchStatus(data.username + ' の公開作品 ' + data.projects.length + ' 件');
      for (const project of data.projects) {
        const card = document.createElement('article'); card.className = 'scratch-project';
        const image = document.createElement('img'); image.src = project.thumbnail; image.alt = ''; image.loading = 'lazy';
        const title = document.createElement('strong'); title.textContent = project.title;
        const link = document.createElement('a'); link.href = 'https://scratch.mit.edu/projects/' + encodeURIComponent(project.id) + '/'; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Scratchで見る';
        const add = document.createElement('button'); add.type = 'button'; add.className = 'primary'; add.textContent = '私の作品に追加';
        add.addEventListener('click', async () => {
          add.disabled = true; add.textContent = '追加中…';
          try {
            const r = await fetch('/my/api/scratch/import', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest', Accept: 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ projectId: project.id }) });
            const result = await r.json(); if (!r.ok) throw new Error(result.message || '取り込みに失敗しました');
            scratchStatus('「' + result.title + '」を私の作品に追加しました。'); await load(true); add.textContent = '追加済み';
          } catch (error) { scratchStatus(error.message, true); add.disabled = false; add.textContent = '私の作品に追加'; }
        });
        card.append(image, title, link, add); $('scratchProjects').append(card);
      }
    } catch (error) { scratchStatus(error.message, true); }
    finally { $('scratchSearchBtn').disabled = false; }
  };
  $('scratchSearchBtn').addEventListener('click', searchScratch);
  $('scratchUsername').addEventListener('keydown', (event) => { if (event.key === 'Enter') searchScratch(); });

  $('uploadBtn').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', async () => {
    const file = $('file').files[0];
    $('file').value = '';
    if (!file) return;
    if (!/\.sb3$/i.test(file.name)) return setStatus('.sb3 ファイルを選んでください');
    if (file.size > state.maxBytes) return setStatus('ファイルが大きすぎます(上限 ' + fmtSize(state.maxBytes) + ')');
    const title = file.name.replace(/\.sb3$/i, '').slice(0, 60) || '無題の作品';
    setStatus('追加中…', true);
    try {
      await api('/my/api/projects?title=' + encodeURIComponent(title), { method: 'POST', raw: file });
      setStatus('「' + title + '」を追加しました', true);
      await load(true);
    } catch (err) {
      setStatus(err.message);
    }
  });

  load();
})();
</script>
</body>
</html>
