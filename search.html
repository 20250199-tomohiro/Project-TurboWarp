<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>プロジェクト検索</title>
<style>
  :root {
    --accent: #FF4C4C;
    --bg: #f3f4f6;
    --fg: #111;
    --card: #fff;
    --muted: #666;
    --line: #d1d5db;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --fg: #f3f4f6; --card: #1f2937; --muted: #9ca3af; --line: #374151; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  header { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px 8px; }
  .logo { display: block; width: min(360px, 80vw); height: auto; }
  form { display: flex; flex-wrap: wrap; gap: 8px; width: min(720px, 100%); }
  input[type="search"] { flex: 1 1 240px; min-width: 0; }
  input, select, button { padding: 10px 12px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line);
                          background: var(--card); color: var(--fg); }
  input:focus, select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  button { border: 0; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
  button:hover { filter: brightness(0.92); }
  button:disabled { opacity: .6; cursor: default; }
  main { width: min(1100px, 100%); margin: 0 auto; padding: 16px; }
  #status { min-height: 1.5em; margin: 0 0 12px; color: var(--muted); }
  #status.error { color: #d33; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; background: var(--card);
          border: 1px solid var(--line); color: inherit; text-decoration: none; }
  .card:hover, .card:focus-visible { outline: 2px solid var(--accent); }
  .thumb { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: rgba(127,127,127,.25); display: block; }
  .info { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 12px; }
  .title { font-weight: 700; font-size: 15px; overflow: hidden; display: -webkit-box;
           -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .author { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
  .stats .heart { color: var(--accent); }
  .stats .star { color: #e6a700; }
  #more { display: block; margin: 24px auto; }
</style>
</head>
<body>
<header>
  <a href="/"><img class="logo" src="/logo.png" alt="TURBOWARP"></a>
  <form id="form">
    <input type="search" id="q" placeholder="プロジェクトを検索" maxlength="100" autofocus required aria-label="検索キーワード">
    <select id="mode" aria-label="並び順">
      <option value="popular">人気順</option>
      <option value="trending">トレンド</option>
      <option value="recent">新着順</option>
    </select>
    <button type="submit">検索</button>
  </form>
</header>
<main>
  <p id="status" role="status"></p>
  <div id="results"></div>
  <button id="more" type="button" hidden>もっと見る</button>
</main>
<script>
(() => {
  const LIMIT = 20;
  const form = document.getElementById('form');
  const qInput = document.getElementById('q');
  const modeSelect = document.getElementById('mode');
  const statusEl = document.getElementById('status');
  const results = document.getElementById('results');
  const moreBtn = document.getElementById('more');
  const submitBtn = form.querySelector('button[type="submit"]');

  let current = { q: '', mode: 'popular', offset: 0 };
  let loading = false;
  let requestId = 0;

  const fmt = (n) => Number(n || 0).toLocaleString('ja-JP');

  const setStatus = (text, isError = false) => {
    statusEl.textContent = text;
    statusEl.classList.toggle('error', isError);
  };

  const makeStat = (className, label, value) => {
    const span = document.createElement('span');
    if (className) span.className = className;
    span.textContent = label + ' ' + fmt(value);
    return span;
  };

  const makeCard = (item) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '/#' + encodeURIComponent(item.id);
    a.target = '_blank';
    a.rel = 'noopener';

    const img = document.createElement('img');
    img.className = 'thumb';
    img.loading = 'lazy';
    img.alt = '';
    img.src = '/search-thumb/' + encodeURIComponent(item.id);
    img.addEventListener('error', () => { img.removeAttribute('src'); });

    const info = document.createElement('div');
    info.className = 'info';

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = item.title || '(無題)';

    const author = document.createElement('div');
    author.className = 'author';
    author.textContent = 'by ' + (item.author || '不明');

    const stats = document.createElement('div');
    stats.className = 'stats';
    stats.append(
      makeStat('', '閲覧数', item.views),
      makeStat('star', '★', item.favorites),
      makeStat('heart', '♥', item.loves)
    );

    info.append(title, author, stats);
    a.append(img, info);
    return a;
  };

  const load = async (reset) => {
    if (loading) return;
    loading = true;
    const myRequest = ++requestId;
    submitBtn.disabled = true;
    moreBtn.disabled = true;

    if (reset) {
      results.replaceChildren();
      moreBtn.hidden = true;
      current.offset = 0;
    }
    setStatus('検索中…');

    try {
      const params = new URLSearchParams({
        q: current.q,
        mode: current.mode,
        offset: String(current.offset)
      });
      const res = await fetch('/search-api?' + params.toString(), { credentials: 'same-origin' });
      if (res.status === 401) {
        location.reload();
        return;
      }
      if (!res.ok) throw new Error('status ' + res.status);
      const items = await res.json();
      if (myRequest !== requestId) return;

      for (const item of items) results.append(makeCard(item));
      current.offset += items.length;

      if (results.children.length === 0) {
        setStatus('「' + current.q + '」に一致するプロジェクトは見つかりませんでした。');
      } else {
        setStatus(results.children.length + ' 件を表示中');
      }
      moreBtn.hidden = items.length < LIMIT;
    } catch (err) {
      setStatus('検索に失敗しました。少し待ってから、もう一度お試しください。', true);
    } finally {
      loading = false;
      submitBtn.disabled = false;
      moreBtn.disabled = false;
    }
  };

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = qInput.value.trim();
    if (!q) return;
    current = { q, mode: modeSelect.value, offset: 0 };
    load(true);
  });

  moreBtn.addEventListener('click', () => load(false));
})();
</script>
</body>
</html>
