<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>メッセージ</title><style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--fg:#172033;--muted:#667085;--line:#dce2ec;--accent:#ff4c4c;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--bg:#101521;--card:#1b2433;--fg:#f2f5fa;--muted:#aab4c4;--line:#344054;--soft:#263247}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif}header{padding:20px 16px 8px;text-align:center}header img{width:min(220px,60vw)}nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px}nav a,.btn{border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--fg);text-decoration:none;background:var(--card);cursor:pointer;font:inherit}main{width:min(900px,100%);margin:18px auto;padding:0 16px 40px}h1{font-size:26px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}.lead{color:var(--muted);margin:4px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}.row input,.row select{flex:1}.primary{background:var(--accent);border:0;color:white;font-weight:700}.danger{color:#d92d20}.muted{color:var(--muted);font-size:13px}.status{min-height:1.5em;color:var(--muted)}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);padding:11px;border-radius:10px}.item small{display:block;color:var(--muted)}button:disabled{opacity:.5;cursor:not-allowed}.code{font:700 22px ui-monospace,monospace;letter-spacing:3px;padding:12px;background:var(--soft);border-radius:10px;display:inline-block;user-select:all}.hidden{display:none!important}a{color:inherit}
</style><style>.chat{height:min(55vh,520px);overflow:auto;display:flex;flex-direction:column;gap:9px;padding:12px;background:var(--soft);border-radius:12px}.bubble{max-width:82%;padding:10px 13px;border-radius:14px;background:var(--card);overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#ff4c4c;color:white}.bubble time{display:block;font-size:11px;opacity:.7;margin-top:3px}</style><link rel="stylesheet" href="/mirror-ui.css?v=3">
<script src="/mirror-theme.js" defer></script>
</head><body><header class="mirror-topbar">
  <a class="mirror-brand" href="/" aria-label="TurboWarp ホーム">TURBOWARP</a>
  <nav class="mirror-main-nav" aria-label="メインナビゲーション">
    <a href="/">ホーム</a><a href="/my">私の作品</a><a href="/search">作品を探す</a>
    <a href="/friends">フレンド</a><a href="/messages">メッセージ</a>
    <a href="/collaboration">共同制作</a><a href="/packager">パッケージ化</a>
  </nav>
</header><main><h1>メッセージ</h1><p class="lead">フレンドとメッセージをやり取りできます。</p><section class="card"><h2>相手を選択</h2><div class="row"><select id="friend"><option value="">フレンドを読み込み中…</option></select><button id="refresh" class="btn">更新</button></div></section><section class="card"><div id="chat" class="chat" aria-live="polite"><p class="muted">フレンドを選択してください。</p></div><form id="form" class="row" style="margin-top:12px"><input id="body" maxlength="2000" placeholder="メッセージを入力…" autocomplete="off"><button class="btn primary" type="submit">送信</button></form><p id="status" class="status" role="status"></p></section></main><script>
(()=>{const $=id=>document.getElementById(id);let selected=0,lastCount=-1,myId=0;const api=async(p,o={})=>{const r=await fetch('/api/social'+p,{method:o.method||'GET',credentials:'same-origin',headers:{'X-Mirror':'1',...(o.body?{'Content-Type':'application/json'}:{})},body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'通信に失敗しました');return d};const status=t=>$('status').textContent=t;async function loadFriends(){const d=await api('/friends');myId=Number(d.accountId)||0;const sel=$('friend');sel.replaceChildren(new Option('相手を選択してください',''));d.friends.forEach(f=>sel.add(new Option(f.username+' (ID: '+f.id+')',f.id)));const q=Number(new URLSearchParams(location.search).get('friend'));selected=d.friends.some(f=>f.id===q)?q:(selected&&d.friends.some(f=>f.id===selected)?selected:0);sel.value=selected||'';if(selected)loadMessages()}async function loadMessages(){if(!selected)return;try{const d=await api('/messages/'+selected);const box=$('chat');if(d.messages.length!==lastCount){box.replaceChildren();if(!d.messages.length){const p=document.createElement('p');p.className='muted';p.textContent='まだメッセージはありません。最初のメッセージを送ってみましょう。';box.append(p)}d.messages.forEach(m=>{const b=document.createElement('div');b.className='bubble'+(m.sender_id===myId?' mine':'');b.textContent=m.body;const time=document.createElement('time');time.textContent=new Date(m.created_at).toLocaleString('ja-JP');b.append(time);box.append(b)});box.scrollTop=box.scrollHeight;lastCount=d.messages.length}}catch(e){status(e.message)}}$('friend').onchange=()=>{selected=Number($('friend').value)||0;lastCount=-1;loadMessages()};$('refresh').onclick=()=>{lastCount=-1;loadMessages()};$('form').onsubmit=async e=>{e.preventDefault();const body=$('body').value.trim();if(!selected)return status('先にフレンドを選択してください');if(!body)return;try{await api('/messages/'+selected,{method:'POST',body:{body}});$('body').value='';lastCount=-1;await loadMessages();status('送信しました')}catch(err){status(err.message)}};loadFriends().catch(e=>status(e.message));setInterval(loadMessages,3500)})();
</script></body></html>
