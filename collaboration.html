<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>共同制作</title><style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--fg:#172033;--muted:#667085;--line:#dce2ec;--accent:#ff4c4c;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--bg:#101521;--card:#1b2433;--fg:#f2f5fa;--muted:#aab4c4;--line:#344054;--soft:#263247}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif}header{padding:20px 16px 8px;text-align:center}header img{width:min(220px,60vw)}nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px}nav a,.btn{border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--fg);text-decoration:none;background:var(--card);cursor:pointer;font:inherit}main{width:min(900px,100%);margin:18px auto;padding:0 16px 40px}h1{font-size:26px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}.lead{color:var(--muted);margin:4px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}.row input,.row select{flex:1}.primary{background:var(--accent);border:0;color:white;font-weight:700}.danger{color:#d92d20}.muted{color:var(--muted);font-size:13px}.status{min-height:1.5em;color:var(--muted)}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);padding:11px;border-radius:10px}.item small{display:block;color:var(--muted)}button:disabled{opacity:.5;cursor:not-allowed}.code{font:700 22px ui-monospace,monospace;letter-spacing:3px;padding:12px;background:var(--soft);border-radius:10px;display:inline-block;user-select:all}.hidden{display:none!important}a{color:inherit}
</style></head><body><header><a href="/"><img src="/logo.png" alt="TurboWarp"></a><nav><a href="/">トップ</a><a href="/friends">フレンド</a><a href="/messages">メッセージ</a><a href="/my">私の作品</a></nav></header><main><h1>共同制作</h1><p class="lead">ひとつの作品をみんなで共有。参加コードを使って同じルームに入りましょう。</p><div class="grid"><section class="card"><h2>ルームを作成</h2><p class="muted">「私の作品」に保存済みのプロジェクトを選んでください。</p><select id="project"><option value="">作品を読み込み中…</option></select><button id="create" class="btn primary" style="margin-top:10px;width:100%">ルームを作成して編集する</button></section><section class="card"><h2>ルームに参加</h2><p class="muted">フレンドから受け取った6桁の参加コードを入力。</p><input id="code" maxlength="6" placeholder="6桁の参加コード" autocomplete="off"><button id="join" class="btn primary" style="margin-top:10px;width:100%">参加して編集する</button></section></div><section class="card"><h2>ルームの情報・ToDo</h2><div class="row"><input id="roomCode" maxlength="6" placeholder="管理するルームコード"><button id="open" class="btn">ルームを表示</button></div><div id="room" class="hidden"><p id="roomInfo" class="muted"></p><h2>参加者</h2><div id="members" class="list"></div><h2 style="margin-top:18px">共有ToDoリスト</h2><form id="todoForm" class="row"><input id="todoTitle" maxlength="300" placeholder="新しいタスクを入力"><button class="btn primary">追加</button></form><div id="todos" class="list" style="margin-top:10px"></div><button id="edit" class="btn primary" style="margin-top:16px">この作品をエディターで開く</button><button id="leave" class="btn danger" style="margin-top:16px">ルームから退出</button></div><p id="status" class="status" role="status"></p></section></main><script>
(()=>{const $=id=>document.getElementById(id);let active='';const api=async(p,o={})=>{const r=await fetch('/api/social'+p,{method:o.method||'GET',credentials:'same-origin',headers:{'X-Mirror':'1',...(o.body?{'Content-Type':'application/json'}:{})},body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'通信に失敗しました');return d};const status=t=>$('status').textContent=t;const go=code=>{const u=new URL('/',location.origin);u.searchParams.set('collab_room',code);location.href=u.href};async function projects(){try{const r=await fetch('/my/api/projects',{credentials:'same-origin'});const d=await r.json();const s=$('project');s.replaceChildren(new Option('作品を選択してください',''));(d.projects||[]).forEach(p=>s.add(new Option(p.title+' (ID: '+p.id+')',p.id)))}catch(e){status('作品一覧を読み込めません: '+e.message)}}async function loadRoom(code){active=code.toUpperCase();$('roomCode').value=active;const d=await api('/rooms/'+active);await api('/rooms/'+active+'/heartbeat',{method:'POST',body:{}});$('room').classList.remove('hidden');$('roomInfo').textContent='参加コード: '+active+' ・ 作品ID: '+d.projectId+' ・ 更新番号: '+d.revision;$('members').replaceChildren();d.members.forEach(m=>{const x=document.createElement('div');x.className='item';x.textContent=m.username;$('members').append(x)});$('todos').replaceChildren();if(!d.todos.length){const p=document.createElement('p');p.className='muted';p.textContent='ToDoはまだありません。最初のタスクを追加しましょう.';$('todos').append(p)}d.todos.forEach(t=>{const row=document.createElement('div');row.className='item';const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=t.done;check.style.width='auto';check.onchange=async()=>{try{await api('/rooms/'+active+'/todos/'+t.id,{method:'PATCH',body:{done:check.checked}});loadRoom(active)}catch(e){status(e.message)}};const text=document.createElement('span');text.textContent=' '+t.title;text.style.textDecoration=t.done?'line-through':'none';label.append(check,text);const del=document.createElement('button');del.className='btn danger';del.textContent='削除';del.onclick=async()=>{try{await api('/rooms/'+active+'/todos/'+t.id,{method:'DELETE'});loadRoom(active)}catch(e){status(e.message)}};row.append(label,del);$('todos').append(row)})} $('create').onclick=async()=>{const projectId=Number($('project').value);if(!projectId)return status('作品を選択してください');try{const d=await api('/rooms',{method:'POST',body:{projectId}});go(d.code)}catch(e){status(e.message)}};$('join').onclick=async()=>{const code=$('code').value.trim().toUpperCase();try{const d=await api('/rooms/join',{method:'POST',body:{code}});go(d.code)}catch(e){status(e.message)}};$('open').onclick=()=>loadRoom($('roomCode').value.trim()).catch(e=>status(e.message));$('todoForm').onsubmit=async e=>{e.preventDefault();const title=$('todoTitle').value.trim();if(!active)return status('先にルームを表示してください');if(!title)return;try{await api('/rooms/'+active+'/todos',{method:'POST',body:{title}});$('todoTitle').value='';loadRoom(active)}catch(err){status(err.message)}};$('edit').onclick=()=>active&&go(active);$('leave').onclick=async()=>{if(!active||!confirm('このルームから退出しますか？'))return;try{await api('/rooms/'+active+'/leave',{method:'DELETE'});$('room').classList.add('hidden');active='';status('ルームから退出しました')}catch(e){status(e.message)}};projects();const q=new URLSearchParams(location.search).get('code');if(q)loadRoom(q).catch(e=>status(e.message));setInterval(()=>{if(active)loadRoom(active).catch(e=>status(e.message))},5000)})();
</script></body></html>
