<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>フレンド管理</title><style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--fg:#172033;--muted:#667085;--line:#dce2ec;--accent:#ff4c4c;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--bg:#101521;--card:#1b2433;--fg:#f2f5fa;--muted:#aab4c4;--line:#344054;--soft:#263247}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif}header{padding:20px 16px 8px;text-align:center}header img{width:min(220px,60vw)}nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px}nav a,.btn{border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--fg);text-decoration:none;background:var(--card);cursor:pointer;font:inherit}main{width:min(900px,100%);margin:18px auto;padding:0 16px 40px}h1{font-size:26px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}.lead{color:var(--muted);margin:4px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}.row input,.row select{flex:1}.primary{background:var(--accent);border:0;color:white;font-weight:700}.danger{color:#d92d20}.muted{color:var(--muted);font-size:13px}.status{min-height:1.5em;color:var(--muted)}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);padding:11px;border-radius:10px}.item small{display:block;color:var(--muted)}button:disabled{opacity:.5;cursor:not-allowed}.code{font:700 22px ui-monospace,monospace;letter-spacing:3px;padding:12px;background:var(--soft);border-radius:10px;display:inline-block;user-select:all}.hidden{display:none!important}a{color:inherit}
</style><link rel="stylesheet" href="/mirror-ui.css?v=3">
<script src="/mirror-theme.js?v=shared-account-fix-2" defer></script>
</head><body><header class="mirror-topbar">
  <a class="mirror-brand" href="/" aria-label="TurboWarp ホーム">TURBOWARP</a>
  <nav class="mirror-main-nav" aria-label="メインナビゲーション">
    <a class="mirror-new-project" href="/editor.html"><span aria-hidden="true">＋</span> 新規作成</a>
    <a href="/">ホーム</a><a href="/my">私の作品</a><a href="/search">作品を探す</a>
    <a href="/friends">フレンド</a><a href="/messages">メッセージ</a>
    <a href="/collaboration">共同制作</a><a href="/packager">パッケージ化</a></nav>
</header><main><h1>フレンド</h1><p class="lead">フレンドコードを交換して、作品づくりを一緒に楽しもう。</p><div class="grid"><section class="card" id="my-code"><h2>あなたのフレンドコード</h2><p class="muted">このコードを相手に伝えてください。</p><div class="row"><span id="code" class="code">読み込み中</span><button id="copy" class="btn">コピー</button></div></section><section class="card"><h2>フレンドを追加</h2><p class="muted">相手から教えてもらった8桁のコードを入力。</p><div class="row"><input id="friendCode" maxlength="8" placeholder="例：ABCD2345" autocomplete="off"><button id="add" class="btn primary">申請する</button></div><p id="status" class="status" role="status"></p></section></div><section class="card"><h2>フレンド一覧</h2><div id="friends" class="list">読み込み中…</div></section><section class="card"><h2>届いているフレンド申請</h2><div id="incoming" class="list">読み込み中…</div></section><section class="card"><h2>送信した申請</h2><div id="outgoing" class="list">読み込み中…</div></section></main><script>
(()=>{const $=id=>document.getElementById(id);const api=async(p,o={})=>{const r=await fetch('/api/social'+p,{method:o.method||'GET',credentials:'same-origin',headers:{'X-Mirror':'1',...(o.body?{'Content-Type':'application/json'}:{})},body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'通信に失敗しました');return d};const msg=t=>$('status').textContent=t;const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};async function load(){try{const d=await api('/friends');$('code').textContent=d.code;$('friends').replaceChildren();$('incoming').replaceChildren();$('outgoing').replaceChildren();if(!d.friends.length)$('friends').append(el('p','muted','まだフレンドはいません。コードを交換して追加しましょう。'));d.friends.forEach(f=>{const row=el('div','item');const name=el('div','',f.username);name.append(el('small','', 'ID: '+f.id));const actions=el('div','row');const profile=el('a','btn','プロフィール');profile.href='/profile/'+f.id;const chat=el('a','btn','メッセージ');chat.href='/messages?friend='+f.id;const remove=el('button','btn danger','削除');remove.onclick=async()=>{if(confirm(f.username+' をフレンドから削除しますか？')){await api('/friends/'+f.id,{method:'DELETE'});load()}};actions.append(profile,chat,remove);row.append(name,actions);$('friends').append(row)});if(!d.incoming.length)$('incoming').append(el('p','muted','受信した申請はありません。'));d.incoming.forEach(x=>{const row=el('div','item');row.append(el('span','',x.username+' からの申請'));const a=el('div','row');[['承認',true],['拒否',false]].forEach(([t,v])=>{const b=el('button','btn '+(v?'primary':'danger'),t);b.onclick=async()=>{await api('/friends/requests/'+x.id+'/respond',{method:'POST',body:{accept:v}});load()};a.append(b)});row.append(a);$('incoming').append(row)});if(!d.outgoing.length)$('outgoing').append(el('p','muted','送信中の申請はありません。'));d.outgoing.forEach(x=>$('outgoing').append(el('div','item',x.username+' に申請中')))}catch(e){msg(e.message)}}$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('code').textContent);msg('フレンドコードをコピーしました')}catch(e){msg('コードを長押ししてコピーしてください')}};$('add').onclick=async()=>{const code=$('friendCode').value.trim().toUpperCase();if(!code)return msg('フレンドコードを入力してください');try{await api('/friends/request',{method:'POST',body:{code}});$('friendCode').value='';msg('フレンド申請を送信しました');load()}catch(e){msg(e.message)}};load()})();
</script><script src="/account-menu.js?v=shared-account-fix-2" defer></script>
</body></html>
